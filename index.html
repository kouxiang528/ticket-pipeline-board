const STAGE_ORDER = ["265315635","265315637","1017412124","265315638"];
const STAGE_NAMES = {"265315635":"Pending Assignment","265315637":"In Progress","1017412124":"On Hold","265315638":"Closed"};
let showClosed = false;
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function dueSort(a,b){const x=a.due_date||"9999",y=b.due_date||"9999";return x<y?-1:x>y?1:0}
function card(t){
  const p=(t.priority||"").toUpperCase();
  const pc=p==="HIGH"?"p-high":p==="MEDIUM"?"p-med":"p-low";
  let due="";
  if(t.due_date){const over=t.due_date<todayStr();due=`<span class="due${over?" overdue":""}">Due ${esc(t.due_date)}</span>`}
  const long=(t.content||"").length>220;
  return `<div class="card" data-subject="${esc((t.subject||"").toLowerCase())}" data-id="${esc(String(t.id))}" data-content="${esc((t.content||"").toLowerCase())}" data-priority="${esc(p)}" data-assignee="${esc(t.de_assignee||"")}" data-owner="${esc((t.owner||"").toLowerCase())}" data-deal="${esc((t.deal||"").toLowerCase())}">
    <h3>${esc(t.subject||"(no subject)")}</h3>
    <div class="meta"><span class="badge ${pc}">${esc(p||"—")}</span><span class="idtag">#${esc(String(t.id))}</span>${t.de_assignee?`<span class="assignee">👤 ${esc(t.de_assignee)}</span>`:""}${t.owner?`<span class="assignee">Owner: ${esc(t.owner)}</span>`:""}${t.deal?`<span class="assignee">Deal: ${esc(t.deal)}</span>`:""}${due}</div>
    ${t.content?`<div class="desc${long?" collapsed":""}">${esc(t.content)}</div>${long?`<span class="more" onclick="this.previousElementSibling.classList.toggle('collapsed');this.textContent=this.textContent==='Show more'?'Show less':'Show more'">Show more</span>`:""}`:""}
  </div>`;
}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function render(){
  const q=document.getElementById("q").value.toLowerCase().trim();
  const fp=document.getElementById("fpri").value, fa=document.getElementById("fass").value;
  const board=document.getElementById("board");board.innerHTML="";
  STAGE_ORDER.forEach(sid=>{
    if(sid==="265315638"&&!showClosed)return;
    const list=DATA.tickets.filter(t=>String(t.stage_id)===sid)
      .filter(t=>!q||t.subject?.toLowerCase().includes(q)||String(t.id).includes(q)||(t.content||"").toLowerCase().includes(q)||(t.owner||"").toLowerCase().includes(q)||(t.deal||"").toLowerCase().includes(q))
      .filter(t=>!fp||(t.priority||"").toUpperCase()===fp)
      .filter(t=>!fa||t.de_assignee===fa)
      .sort(dueSort);
    const col=document.createElement("div");col.className="col";
    col.innerHTML=`<h2>${STAGE_NAMES[sid]}<span class="count">${list.length}</span></h2>`+
      (list.length?list.map(card).join(""):`<div class="empty">No tickets</div>`);
    board.appendChild(col);
  });
}
function initFilters(){
  const pris=[...new Set(DATA.tickets.map(t=>(t.priority||"").toUpperCase()).filter(Boolean))].sort();
  const fp=document.getElementById("fpri");
  pris.forEach(p=>{const o=document.createElement("option");o.value=p;o.textContent=p;fp.appendChild(o)});
  const ass=[...new Set(DATA.tickets.map(t=>t.de_assignee).filter(Boolean))].sort();
  const fa=document.getElementById("fass");
  ass.forEach(a=>{const o=document.createElement("option");o.value=a;o.textContent=a;fa.appendChild(o)});
  document.getElementById("q").addEventListener("input",render);
  fp.addEventListener("change",render);fa.addEventListener("change",render);
  document.getElementById("showClosed").addEventListener("change",e=>{showClosed=e.target.checked;render()});
}
initFilters();render();
</script>
